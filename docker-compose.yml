services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      PORT: ${PORT:-3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FUJI_RPC_URL: ${FUJI_RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
      ARKIV_RPC: ${ARKIV_RPC:-https://rpc.tiramisu.db-chain.testnet.arkiv.network}
      ARKIV_ACCESS_KEY: ${ARKIV_ACCESS_KEY:-}
      ARKIV_PRIVATE_KEY: ${ARKIV_PRIVATE_KEY:-}
    ports:
      - "3001:${PORT:-3001}"
    volumes:
      - ./apps/api/src:/app/apps/api/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  sync:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      FUJI_RPC_URL: ${FUJI_RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
      ARKIV_RPC: ${ARKIV_RPC:-https://rpc.tiramisu.db-chain.testnet.arkiv.network}
      ARKIV_ACCESS_KEY: ${ARKIV_ACCESS_KEY:-}
      ARKIV_PRIVATE_KEY: ${ARKIV_PRIVATE_KEY:-}
    command:
      - sh
      - -c
      - |
        while true; do
          pnpm sync
          sleep "$${SYNC_INTERVAL_SECONDS}"
        done
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_API_PROXY_TARGET: http://api:3001
      VITE_AVALANCHE_RPC: ${VITE_AVALANCHE_RPC:-}
      VITE_CHAIN_ID: ${VITE_CHAIN_ID:-43113}
      VITE_SWARM_ID_ORIGIN: ${VITE_SWARM_ID_ORIGIN:-https://swarm-id.snaha.net}
      TLS_KEY_PATH: /tls/key.pem
      TLS_CERT_PATH: /tls/cert.pem
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./.local-tls:/tls:ro
      # Keep workspace evidence exports current for Vite during development.
      - ./packages/evidence:/app/packages/evidence
    depends_on:
      api:
        condition: service_healthy
